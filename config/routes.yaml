# 栖语 - 意图路由规则配置
# 修改此文件后，网关会自动热重载（无需重启）
# 规则优先级：从上到下依次匹配，匹配到即停止

version: "1.0"

# ============ 意图定义 ============
intents:
  greeting:
    name: "问候"
    description: "用户打招呼或寒暄"
    priority: 10  # 最高优先级
    
  emotion:
    name: "情绪支持"
    description: "用户表达负面情绪，需要安慰"
    priority: 9
    
  tool_call:
    name: "工具调用"
    description: "用户要求执行某个工具/操作"
    priority: 8
    
  memory_query:
    name: "记忆查询"
    description: "用户问起过去的事情或已记住的信息"
    priority: 7
    
  rag_query:
    name: "知识查询"
    description: "用户询问某个知识/概念/教程"
    priority: 6
    
  chat:
    name: "普通聊天"
    description: "日常闲聊"
    priority: 1  # 最低，兜底

# ============ 规则引擎 ============
# 每条规则包含匹配条件和匹配后的动作
rules:
  # --- 问候规则 ---
  - id: "greeting_exact"
    intent: greeting
    match_type: regex
    patterns:
      - "^(你好|嗨|哈喽|hey|hi|hello|在吗|在不在)"
      - "^(早上好|中午好|晚上好|晚安|早安)"
    confidence: 0.95
    
  # --- 情绪支持规则 ---
  - id: "emotion_keywords"
    intent: emotion
    match_type: keyword
    keywords:
      - "难过"
      - "伤心"
      - "累"
      - "压力"
      - "焦虑"
      - "害怕"
      - "担心"
      - "不开心"
      - "郁闷"
      - "烦"
      - "痛苦"
      - "孤独"
      - "无助"
      - "想哭"
      - "绝望"
      - "迷茫"
      - "撑不住"
    threshold: 1  # 命中1个关键词即触发
    confidence: 0.75
    
  - id: "emotion_patterns"
    intent: emotion
    match_type: regex
    patterns:
      - "(我|感觉|觉得).{0,5}(不好|差|糟|难受)"
      - "(怎么办|怎么办啊|该.*办).{0,3}$"
      - "(不想|不愿).{0,5}(活|做|动|说话)"
    confidence: 0.85
    
  # --- 工具调用规则 ---
  - id: "tool_save_memory"
    intent: tool_call
    match_type: keyword
    keywords:
      - "保存"
      - "记住"
      - "记下来"
      - "记一下"
      - "帮我记"
    tool_name: "save_memory"
    threshold: 1
    confidence: 0.85
    
  - id: "tool_search"
    intent: tool_call
    match_type: keyword
    keywords:
      - "搜索"
      - "查找"
      - "查询"
      - "搜一下"
    tool_name: "rag_search"
    threshold: 1
    confidence: 0.8
    
  # --- 记忆查询规则 ---
  - id: "memory_keywords"
    intent: memory_query
    match_type: keyword
    keywords:
      - "记得"
      - "上次"
      - "之前"
      - "以前"
      - "我们说过"
      - "你说过"
      - "我告诉过你"
      - "我说过"
      - "那时候"
      - "当时"
      - "曾经"
      - "你记得"
      - "还记得"
      - "忘了"
      - "想起来"
    threshold: 1
    confidence: 0.7
    
  - id: "memory_patterns"
    intent: memory_query
    match_type: regex
    patterns:
      - "(我.*吗|我们.*吗|你.*记得|是不是.*过)"
    confidence: 0.6
    
  # --- 知识查询规则 ---
  - id: "rag_strong"
    intent: rag_query
    match_type: keyword
    keywords:
      - "什么是"
      - "什么是"
      - "介绍一下"
      - "解释一下"
      - "原理"
      - "概念"
      - "定义"
      - "百科"
    threshold: 1
    confidence: 0.9
    
  - id: "rag_normal"
    intent: rag_query
    match_type: keyword
    keywords:
      - "怎么"
      - "如何"
      - "为什么"
      - "说说"
      - "方法"
      - "步骤"
      - "教程"
      - "文档"
      - "资料"
      - "查一下"
      - "找找"
      - "有没有关于"
    threshold: 2  # 命中2个才触发（避免普通聊天误触）
    confidence: 0.7
    
  - id: "rag_weak"
    intent: rag_query
    match_type: keyword
    keywords:
      - "什么"
      - "怎样"
      - "哪些"
      - "哪里"
      - "谁"
    threshold: 3  # 命中3个才触发
    confidence: 0.5

# ============ 默认行为 ============
defaults:
  fallback_intent: chat
  fallback_confidence: 0.5
  max_keywords: 10  # 提取关键词数量上限

# ============ 高级选项 ============
advanced:
  # 是否启用语义增强（关键词命中后增加上下文分析）
  semantic_boost: true
  
  # 情绪检测的句式模式（正则）
  emotion_patterns:
    - "(我|感觉|觉得).{0,5}(不好|差|糟|难受)"
    - "(怎么办|怎么办啊|该.*办).{0,3}$"
    - "(不想|不愿).{0,5}(活|做|动|说话)"
  
  # 停用词（关键词提取时过滤）
  stop_words:
    - "的"
    - "了"
    - "是"
    - "在"
    - "我"
    - "你"
    - "他"
    - "她"
    - "它"
    - "们"
    - "个"
    - "一"
    - "有"
    - "和"
    - "就"
    - "不"
    - "人"
    - "都"
    - "而"
    - "及"
    - "与"
    - "或"
    - "但是"
    - "因为"
    - "所以"
    - "如果"
    - "那么"
