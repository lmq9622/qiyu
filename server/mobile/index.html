<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>栖语 · Qiyu</title>
<style>
/* ===== 竖屏移动端 UI（Linux 服务器分支） ===== */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg: #0b0d12;
  --bg-soft: #12151d;
  --surface: rgba(255,255,255,0.055);
  --surface-strong: rgba(255,255,255,0.10);
  --border: rgba(255,255,255,0.10);
  --text: #f2f4f8;
  --text-2: #a8b0c0;
  --text-3: #6b7385;
  --accent: #6ea8fe;
  --accent-soft: rgba(110,168,254,0.16);
  --ok: #34d399;
  --warn: #fbbf24;
  --danger: #f87171;
  --radius: 16px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
html, body { height:100%; }
body {
  background: radial-gradient(1200px 600px at 50% -10%, rgba(110,168,254,0.10), transparent 60%), var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
  font-size: 16px; line-height: 1.5;
  overscroll-behavior: none;
}
#app { max-width: 520px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; position: relative; }
.hidden { display: none !important; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea { font: inherit; color: var(--text); background: transparent; border: none; outline: none; }

/* ===== 登录页 ===== */
.auth { flex:1; display:flex; flex-direction:column; justify-content:center; padding: 24px; gap: 18px; }
.auth .brand { text-align:center; margin-bottom: 10px; }
.auth .logo { width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 22px;
  background: linear-gradient(135deg, #6ea8fe, #a78bfa); display:flex; align-items:center; justify-content:center;
  font-size: 34px; font-weight: 700; color:#0b0d12; box-shadow: 0 10px 40px rgba(110,168,254,0.35); }
.auth h1 { font-size: 22px; letter-spacing: 2px; }
.auth .sub { color: var(--text-3); font-size: 13px; margin-top: 4px; }
.field { background: var(--surface); border:1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.field label { display:block; font-size:12px; color:var(--text-3); margin-bottom:6px; }
.field input { width:100%; font-size:16px; }
.auth .row { display:flex; gap:10px; }
.btn { display:flex; align-items:center; justify-content:center; gap:6px;
  border-radius: var(--radius); padding: 14px 18px; font-size:16px; font-weight:600; }
.btn-primary { background: linear-gradient(135deg, #6ea8fe, #8b7cfa); color:#0b0d12; }
.btn-ghost { background: var(--surface); border:1px solid var(--border); color: var(--text-2); }
.btn:active { transform: scale(0.985); }
.btn[disabled] { opacity:.5; }
.auth-tip { font-size:12px; color:var(--text-3); text-align:center; min-height:18px; }
.auth-tab { display:flex; background:var(--surface); border-radius: 14px; padding:4px; gap:4px; }
.auth-tab button { flex:1; padding:10px; border-radius:10px; color:var(--text-2); font-weight:600; }
.auth-tab button.on { background: var(--surface-strong); color: var(--text); }

/* ===== 顶部栏 ===== */
.topbar { display:flex; align-items:center; gap:10px; padding: calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  border-bottom: 1px solid var(--border); background: rgba(11,13,18,0.72); backdrop-filter: blur(18px); z-index: 5; }
.avatar { width:40px; height:40px; border-radius:14px; display:flex; align-items:center; justify-content:center;
  font-size:18px; font-weight:700; color:#0b0d12; flex-shrink:0; }
.char-info { flex:1; min-width:0; }
.char-name { font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.char-status { font-size:12px; color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.char-status .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ok); margin-right:4px; vertical-align:1px; }
.icon-btn { width:40px; height:40px; border-radius:12px; background:var(--surface); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }

/* ===== 角色横条 ===== */
.char-strip { display:flex; gap:8px; overflow-x:auto; padding: 10px 14px; scrollbar-width:none; }
.char-strip::-webkit-scrollbar { display:none; }
.char-chip { flex-shrink:0; display:flex; align-items:center; gap:7px; padding: 8px 14px 8px 8px;
  background: var(--surface); border:1px solid var(--border); border-radius: 999px; color: var(--text-2); font-size:14px; }
.char-chip .mini { width:24px; height:24px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#0b0d12; }
.char-chip.on { background: var(--accent-soft); border-color: rgba(110,168,254,0.5); color: var(--text); }

/* ===== 消息区 ===== */
.messages { flex:1; overflow-y:auto; padding: 14px 14px 8px; display:flex; flex-direction:column; gap:10px;
  -webkit-overflow-scrolling: touch; }
.msg { display:flex; flex-direction:column; max-width: 86%; }
.msg .bubble { padding: 11px 14px; border-radius: 18px; font-size:15.5px; line-height:1.55;
  white-space: pre-wrap; word-break: break-word; }
.msg .time { font-size:10.5px; color:var(--text-3); margin-top:4px; }
.msg.user { align-self:flex-end; align-items:flex-end; }
.msg.user .bubble { background: linear-gradient(135deg, #6ea8fe, #8b7cfa); color:#0b0d12; border-bottom-right-radius:6px; }
.msg.ai { align-self:flex-start; align-items:flex-start; }
.msg.ai .bubble { background: var(--surface-strong); border:1px solid var(--border); border-bottom-left-radius:6px; }
.msg.ai .who { font-size:11px; color:var(--text-3); margin-bottom:4px; }
.typing { display:inline-flex; gap:4px; padding: 4px 2px; }
.typing i { width:7px; height:7px; border-radius:50%; background:var(--text-3); animation: tp 1.2s infinite; }
.typing i:nth-child(2){ animation-delay:.18s } .typing i:nth-child(3){ animation-delay:.36s }
@keyframes tp { 0%,60%,100%{ transform:translateY(0); opacity:.5 } 30%{ transform:translateY(-5px); opacity:1 } }
.sys-note { align-self:center; font-size:12px; color:var(--text-3); background:var(--surface);
  padding: 6px 14px; border-radius:999px; }

/* ===== 输入栏 ===== */
.inputbar { padding: 10px 14px calc(12px + var(--safe-b)); display:flex; gap:10px; align-items:flex-end;
  border-top: 1px solid var(--border); background: rgba(11,13,18,0.72); backdrop-filter: blur(18px); }
.inputbox { flex:1; background: var(--surface); border:1px solid var(--border); border-radius: 20px; padding: 10px 16px;
  max-height: 110px; resize:none; line-height:1.45; font-size:15.5px; }
.sendbtn { width:46px; height:46px; border-radius:50%; background: linear-gradient(135deg,#6ea8fe,#8b7cfa);
  color:#0b0d12; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
.sendbtn[disabled] { opacity:.4; }

/* ===== 侧滑面板 ===== */
.scrim { position:absolute; inset:0; background:rgba(0,0,0,.5); z-index:10; opacity:0; pointer-events:none; transition:opacity .2s; }
.scrim.on { opacity:1; pointer-events:auto; }
.panel { position:absolute; top:0; right:0; bottom:0; width:min(88vw, 380px); z-index:11; background:var(--bg-soft);
  border-left:1px solid var(--border); transform:translateX(100%); transition:transform .24s ease; display:flex; flex-direction:column; }
.panel.on { transform:translateX(0); }
.panel-head { display:flex; align-items:center; justify-content:space-between; padding: calc(14px + env(safe-area-inset-top,0px)) 16px 12px; border-bottom:1px solid var(--border); }
.panel-head h2 { font-size:17px; }
.panel-body { flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; }
.card h3 { font-size:13px; color:var(--text-3); margin-bottom:10px; font-weight:600; letter-spacing:1px; }
.kv { display:flex; justify-content:space-between; font-size:14px; padding:5px 0; }
.kv b { color:var(--text-2); font-weight:500; }
.kv span { color:var(--text); }
.tag { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent); }
.tag.admin { background:rgba(251,191,36,.15); color:var(--warn); }
.tag.off { background:rgba(248,113,113,.15); color:var(--danger); }
.rowbtns { display:flex; gap:8px; }
.rowbtns .btn { flex:1; padding:11px; font-size:14px; }
.user-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
.user-item:last-child { border-bottom:none; }
.user-item .uinfo { flex:1; min-width:0; }
.user-item .uname { font-size:14.5px; font-weight:600; }
.user-item .umeta { font-size:11.5px; color:var(--text-3); }
.mini-btn { padding:6px 10px; border-radius:9px; font-size:12.5px; background:var(--surface); border:1px solid var(--border); color:var(--text-2); }
.mini-btn.danger { color:var(--danger); }

/* ===== Toast ===== */
#toast { position:absolute; left:50%; bottom: calc(90px + var(--safe-b)); transform:translateX(-50%) translateY(10px);
  background:rgba(20,24,32,.95); border:1px solid var(--border); color:var(--text); padding:10px 18px;
  border-radius:12px; font-size:14px; z-index:20; opacity:0; pointer-events:none; transition:all .22s; max-width:86vw; text-align:center; }
#toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
/* ===== 表单控件与微信状态标签（微信通道/体验设置面板用） ===== */
select { background: var(--bg-soft); border:1px solid var(--border); border-radius:10px; color: var(--text); font-size:14px; }
select option { background: var(--bg-soft); color: var(--text); }
input[type="range"] { accent-color: var(--accent); }
.tag.wx { background:rgba(52,211,153,.14); color:var(--ok); }
.tag.wx-off { background:rgba(107,115,133,.15); color:var(--text-3); }
</style>
</head>
<body>
<div id="app">
  <!-- 登录 / 注册 -->
  <section id="authPage" class="auth hidden">
    <div class="brand">
      <div class="logo">栖</div>
      <h1>栖语 Qiyu</h1>
      <div class="sub">AI 陪伴 · 服务器版</div>
    </div>
    <div class="auth-tab">
      <button id="tabLogin" class="on" onclick="switchTab('login')">登录</button>
      <button id="tabReg" onclick="switchTab('reg')">注册</button>
    </div>
    <div class="field"><label>用户名</label><input id="authUser" autocomplete="username" placeholder="用户名"></div>
    <div class="field"><label>密码</label><input id="authPass" type="password" autocomplete="current-password" placeholder="至少 4 位"></div>
    <div class="field hidden" id="nickField"><label>昵称（可选）</label><input id="authNick" placeholder="怎么称呼你？"></div>
    <div class="field hidden" id="inviteField"><label>邀请码（必填）</label><input id="authInvite" placeholder="向管理员索取" autocomplete="off"></div>
    <button class="btn btn-primary" id="authGo" onclick="doAuth()">登 录</button>
    <div class="auth-tip" id="authTip">登录态保存在浏览器 Cookie（30 天），下次打开自动进入</div>
  </section>

  <!-- 主界面：聊天 -->
  <section id="chatPage" class="hidden" style="flex:1; display:flex; flex-direction:column; min-height:0;">
    <div class="topbar">
      <div class="avatar" id="charAvatar">栖</div>
      <div class="char-info">
        <div class="char-name" id="charName">栖语</div>
        <div class="char-status"><span class="dot" id="statusDot"></span><span id="statusText">在线</span></div>
      </div>
      <button class="icon-btn" title="切换角色" onclick="openPanel('chars')">⇄</button>
      <button class="icon-btn" title="更多" onclick="openPanel('more')">☰</button>
    </div>
    <div class="char-strip hidden" id="charStrip"></div>
    <div class="messages" id="messages"></div>
    <div class="inputbar">
      <textarea class="inputbox" id="inputBox" rows="1" placeholder="说点什么…"
        oninput="autoGrow(this); toggleSend()" onkeydown="onKey(event)"></textarea>
      <button class="sendbtn" id="sendBtn" disabled onclick="sendMsg()">➤</button>
    </div>
  </section>

  <!-- 面板：角色 / 我的 / 管理 -->
  <div class="scrim" id="scrim" onclick="closePanel()"></div>
  <div class="panel" id="panel">
    <div class="panel-head">
      <h2 id="panelTitle">角色</h2>
      <button class="icon-btn" onclick="closePanel()">✕</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </div>

  <div id="toast"></div>
</div>

<script>
'use strict';
/* ===== 全局状态（对话数据一律来自服务器，本地只存登录 Token） ===== */
const S = {
  token: localStorage.getItem('qiyu_token') || '',
  user: null,            // 池内账号
  chars: [],             // 角色列表
  charId: '',            // 当前角色
  busy: false,           // AI 正在回复
};
const $ = id => document.getElementById(id);
const API = '';  // 同源部署

function toast(msg, ms=2400) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), ms);
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtTime(ts) {
  try { const d = new Date(ts); const p=n=>String(n).padStart(2,'0');
    return p(d.getHours())+':'+p(d.getMinutes()); } catch(e){ return ''; }
}
async function api(path, { method='GET', body, auth=true } = {}) {
  const headers = { 'Content-Type':'application/json' };
  if (auth && S.token) headers['Authorization'] = 'Bearer ' + S.token;
  const resp = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const text = await resp.text();
  let data; try { data = JSON.parse(text); } catch(e) { data = { raw:text }; }
  if (!resp.ok) {
    const msg = (data && (data.detail || data.message)) || ('HTTP ' + resp.status);
    const err = new Error(typeof msg === 'string' ? msg : JSON.stringify(msg));
    err.status = resp.status; throw err;
  }
  return data;
}

/* ===== 页面切换 ===== */
function showPage(p) {
  $('authPage').classList.toggle('hidden', p !== 'auth');
  $('chatPage').classList.toggle('hidden', p !== 'chat');
  if (p === 'auth') $('authPage').style.display = '';
  if (p !== 'auth') $('authPage').style.display = 'none';
}
let authMode = 'login';
function switchTab(mode) {
  authMode = mode;
  $('tabLogin').classList.toggle('on', mode==='login');
  $('tabReg').classList.toggle('on', mode==='reg');
  $('nickField').classList.toggle('hidden', mode!=='reg');
  $('inviteField').classList.toggle('hidden', mode!=='reg');
  $('authGo').textContent = mode==='login' ? '登 录' : '注 册';
}
async function doAuth() {
  const username = $('authUser').value.trim();
  const password = $('authPass').value;
  if (!username || !password) { toast('请填写用户名和密码'); return; }
  if (authMode === 'reg' && !$('authInvite').value.trim()) { toast('请填写邀请码'); return; }
  $('authGo').disabled = true;
  try {
    const r = authMode === 'login'
      ? await api('/v1/pool/login', { method:'POST', body:{ username, password }, auth:false })
      : await api('/v1/pool/register', { method:'POST', body:{ username, password, nickname: $('authNick').value.trim(), invite_code: $('authInvite').value.trim() }, auth:false });
    S.token = r.token; S.user = r.user;
    localStorage.setItem('qiyu_token', r.token);
    await enterChat();
  } catch(e) { toast(e.message || '登录失败'); }
  finally { $('authGo').disabled = false; }
}

/* ===== 进入聊天 ===== */
async function enterChat() {
  showPage('chat');
  try {
    const [chars, me] = await Promise.all([
      api('/v1/characters'),
      api('/v1/pool/me'),
    ]);
    S.chars = (chars.data || chars || []);
    S.user = (me.user || S.user);
    if (!S.chars.length) { toast('服务器还没有角色，请先在桌面管理台创建'); return; }
    const saved = (S.user && S.user.char_id) || '';
    S.charId = S.chars.some(c => c.id === saved) ? saved : S.chars[0].id;
    await selectChar(S.charId, true);
  } catch(e) {
    if (e.status === 401) { logout(true); return; }
    toast(e.message || '初始化失败');
  }
}
async function selectChar(charId, silent=false) {
  if (S.busy) { toast('AI 正在回复，稍后再切换'); return; }
  S.charId = charId;
  try {
    await api('/v1/pool/char/select', { method:'POST', body:{ character_id: charId } });
    await api('/v1/characters/select', { method:'POST', body:{ user_id: S.user.user_key, character_id: charId } });
  } catch(e) { /* 角色状态设置失败不阻断聊天 */ }
  renderHeader(); renderStrip();
  if (!silent) await loadHistory();
}
function charOf() { return S.chars.find(c => c.id === S.charId); }
function renderHeader() {
  const c = charOf(); if (!c) return;
  const av = $('charAvatar');
  av.textContent = (c.name || '栖')[0];
  av.style.background = c.avatar_color || 'linear-gradient(135deg,#6ea8fe,#a78bfa)';
  $('charName').textContent = c.name;
}
function renderStrip() {
  const strip = $('charStrip');
  strip.innerHTML = S.chars.map(c =>
    `<button class="char-chip ${c.id===S.charId?'on':''}" onclick="selectChar('${esc(c.id)}')">
       <span class="mini" style="background:${esc(c.avatar_color || '#6ea8fe')}">${esc((c.name||'栖')[0])}</span>${esc(c.name)}
     </button>`).join('');
}

/* ===== 消息渲染 ===== */
function addBubble(role, text, { time, who, typing=false } = {}) {
  const box = $('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  const t = time || new Date().toISOString();
  div.innerHTML = (role === 'ai' ? `<div class="who">${esc(who || charOf()?.name || '栖语')}</div>` : '') +
    `<div class="bubble">${typing ? '<span class="typing"><i></i><i></i><i></i></span>' : esc(text)}</div>
     <div class="time">${fmtTime(t)}</div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div.querySelector('.bubble');
}
function addNote(text) {
  const box = $('messages');
  const div = document.createElement('div');
  div.className = 'sys-note'; div.textContent = text;
  box.appendChild(div); box.scrollTop = box.scrollHeight;
}
async function loadHistory() {
  const box = $('messages'); box.innerHTML = '';
  if (!S.user) return;
  try {
    const r = await api(`/v1/chat/history?user_id=${encodeURIComponent(S.user.user_key)}&char_id=${encodeURIComponent(S.charId)}&limit=200`);
    const list = r.data || [];
    if (!list.length) {
      addNote(`和「${(charOf()||{}).name || '栖语'}」的对话从这里开始`);
      return;
    }
    for (const m of list) {
      const texts = (m.pieces && m.pieces.length)
        ? m.pieces.map(p => p.text).join('\n')
        : (m.content || '');
      addBubble(m.role === 'user' ? 'user' : 'ai', texts, { time: m.timestamp, who: (charOf()||{}).name });
    }
  } catch(e) { console.warn('加载历史失败', e); }
}

/* ===== 发送 / 流式接收 ===== */
function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.min(110, el.scrollHeight) + 'px'; }
function toggleSend() { $('sendBtn').disabled = !($('inputBox').value.trim() && !S.busy); }
function onKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } }

async function sendMsg() {
  const text = $('inputBox').value.trim();
  if (!text || S.busy) return;
  $('inputBox').value = ''; autoGrow($('inputBox')); toggleSend();
  S.busy = true;
  addBubble('user', text);
  let bubble = addBubble('ai', '', { typing: true });
  let acc = '';            // 流式累积文本
  let queued = false;
  let partialCount = 0;    // 已消费的 partial assistant_messages 条数
  let finalPieces = null;  // 最终权威消息列表
  let failed = false;
  try {
    const resp = await fetch(API + '/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization': 'Bearer ' + S.token },
      body: JSON.stringify({
        model: S.charId,
        messages: [{ role:'user', content: text }],
        temperature: (charOf()||{}).temperature || 0.7,
        stream: true,
        user: S.user.user_key,
      }),
    });
    if (!resp.ok) {
      let msg = 'HTTP ' + resp.status;
      try { const d = await resp.json(); msg = d.detail || d.message || msg; } catch(e){}
      if (resp.status === 503) msg = 'LLM 服务未连接，请检查服务器 LLM 配置';
      throw new Error(msg);
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        const t = line.trim();
        if (!t || !t.startsWith('data: ')) continue;
        const payload = t.slice(6);
        if (payload === '[DONE]') continue;
        let p; try { p = JSON.parse(payload); } catch(e) { continue; }
        if (p.type === 'error') { failed = true; throw new Error(p.message || '生成失败'); }
        if (p.type === 'queued') { queued = true; continue; }
        // OpenAI chunk 增量
        const delta = p.choices?.[0]?.delta || {};
        if (delta.content) { acc += delta.content; bubble.textContent = acc; scrollBottom(); }
        if (delta.reasoning_content) acc += '';  // 思考内容仅展示在管理台，移动端不显示
        // 多消息协议（增量 + 最终）
        if (p.type === 'assistant_messages' && Array.isArray(p.messages)) {
          if (p.partial) {
            const fresh = p.messages.slice(partialCount);
            partialCount = p.messages.length;
            for (const m of fresh) {
              if (m.text) { acc = acc ? acc + '\n' + m.text : m.text; bubble.textContent = acc; scrollBottom(); }
            }
          } else {
            finalPieces = p.messages.filter(m => m.text).map(m => m.text);
          }
        }
      }
    }
    // 收尾：有最终列表则以最终列表为准
    if (finalPieces && finalPieces.length) acc = finalPieces.join('\n');
    if (!acc) {
      if (queued) acc = '（消息已排队，稍后统一回复）';
      else { failed = true; throw new Error('没有收到有效回复'); }
    }
    bubble.textContent = acc; scrollBottom();
  } catch(e) {
    failed = true;
    bubble.textContent = '⚠️ ' + (e.message || '出错了');
  } finally {
    S.busy = false;
    $('sendBtn').disabled = !$('inputBox').value.trim();
    scrollBottom();
  }
}
function scrollBottom() { const b = $('messages'); b.scrollTop = b.scrollHeight; }


/* ===== 微信 ClawBot 通道（每用户独立；数据与监听全在服务器端） ===== */
const WX = { timer: 0, polling: false, last: null };
async function wxRefresh() {
  const stEl = $('wxState');
  if (!stEl) return;
  try {
    const st = await api('/v1/pool/wechat/status');
    WX.last = st;
    if (st.running) stEl.innerHTML = '<span class="tag wx">监听中</span>';
    else if (st.bound) stEl.innerHTML = '<span class="tag wx-off">已绑定 · 未监听</span>';
    else stEl.innerHTML = '<span class="tag wx-off">未绑定</span>';
    const runEl = $('wxRun');
    if (runEl) runEl.textContent = st.running ? '运行中' : (st.bound ? '已停止' : '—');
    if (st.running) { const q = $('wxQr'); if (q) q.innerHTML = ''; }
  } catch(e) { /* 会话失效等场景忽略 */ }
}
async function wxStart() {
  if (WX.polling) { toast('正在等待扫码…'); return; }
  try {
    const r = await api('/v1/pool/wechat/start', { method:'POST', body:{ force:false } });
    if (r.running) { toast('微信已在监听，无需扫码'); wxRefresh(); return; }
    // 等待二维码下发（首次启动有建连时间）
    let qr = '';
    for (let i = 0; i < 8 && !qr; i++) {
      await new Promise(res => setTimeout(res, 800));
      const q = await api('/v1/pool/wechat/qr');
      if (q.running) { toast('已恢复上次登录态，微信监听中'); wxRefresh(); return; }
      if (q.qr) { qr = q.qr; break; }
      if (q.qr_status === 'error') { toast(q.message || '获取二维码失败，请查看服务器日志', 4000); return; }
    }
    const box = $('wxQr');
    if (box && qr) box.innerHTML = '<img src="' + qr + '" alt="微信绑定二维码" style="width:170px;height:170px;border-radius:12px;border:1px solid var(--border)">';
    // 轮询状态：扫码成功 → running；失败 → error
    WX.polling = true;
    clearInterval(WX.timer);
    WX.timer = setInterval(async () => {
      let st;
      try { st = await api('/v1/pool/wechat/status'); }
      catch(e) { clearInterval(WX.timer); WX.polling = false; return; }
      if (st.running) {
        clearInterval(WX.timer); WX.polling = false;
        toast('微信扫码成功，服务器端已开始独立监听');
        const b = $('wxQr'); if (b) b.innerHTML = '';
        wxRefresh();
      } else if (st.qr_status === 'error') {
        clearInterval(WX.timer); WX.polling = false;
        toast(st.qr_message || '微信绑定失败，请重试', 4000);
      }
    }, 2000);
  } catch(e) { toast(e.message || '微信通道启动失败'); }
}
async function wxUnbind() {
  try {
    await api('/v1/pool/wechat/unbind', { method:'POST' });
    clearInterval(WX.timer); WX.polling = false;
    const b = $('wxQr'); if (b) b.innerHTML = '';
    toast('已解绑微信');
    wxRefresh();
  } catch(e) { toast(e.message || '解绑失败'); }
}

/* ===== 对话体验设置（思考强度/温度/显示思考；LLM 地址与 Key 由服务端钉死，前端不暴露） ===== */
async function loadSettings() {
  const think = $('setThinking'), temp = $('setTemp'), show = $('setShowThink');
  if (!think || !temp || !show) return;
  try {
    const s = await api('/v1/settings');
    if (s.thinking_level && Array.from(think.options).some(o => o.value === s.thinking_level)) think.value = s.thinking_level;
    const t = (s.llm && s.llm.default_temperature != null) ? Number(s.llm.default_temperature) : 0.8;
    temp.value = String(t);
    const v = $('setTempVal'); if (v) v.textContent = t.toFixed(1);
    show.checked = !!s.show_thinking;
  } catch(e) { /* 设置读取失败不影响聊天 */ }
}
function bindTempSlider() {
  const temp = $('setTemp'); if (!temp) return;
  const v = $('setTempVal');
  temp.oninput = () => { if (v) v.textContent = Number(temp.value).toFixed(1); };
}
async function saveSettings() {
  try {
    await api('/v1/settings', { method:'POST', body:{
      thinking_level: $('setThinking').value,
      show_thinking: $('setShowThink').checked,
      default_temperature: Number($('setTemp').value),
    }});
    toast('已保存');
  } catch(e) { toast(e.message || '保存失败'); }
}

/* ===== 面板：角色 / 我的 / 管理 ===== */
let panelMode = 'chars';
function openPanel(mode) {
  panelMode = mode;
  $('scrim').classList.add('on');
  $('panel').classList.add('on');
  renderPanel();
}
function closePanel() { $('scrim').classList.remove('on'); $('panel').classList.remove('on'); }
function renderPanel() {
  const title = { chars:'切换角色', more:'我的', admin:'用户池管理' }[panelMode] || '';
  $('panelTitle').textContent = title;
  const body = $('panelBody');
  if (panelMode === 'chars') {
    body.innerHTML = S.chars.map(c => `
      <div class="card" style="display:flex;align-items:center;gap:12px;${c.id===S.charId?'border-color:rgba(110,168,254,.5)':''}">
        <div class="avatar" style="background:${esc(c.avatar_color || '#6ea8fe')};width:44px;height:44px">${esc((c.name||'栖')[0])}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700">${esc(c.name)}</div>
          <div style="font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.tagline||'')}</div>
        </div>
        ${c.id===S.charId ? '<span class="tag">当前</span>' : `<button class="mini-btn" onclick="selectChar('${esc(c.id)}');closePanel()">切换</button>`}
      </div>`).join('');
  }
  else if (panelMode === 'more') {
    const u = S.user || {};
    body.innerHTML = `
      <div class="card">
        <h3>我的账号</h3>
        <div class="kv"><b>用户名</b><span>${esc(u.username)}</span></div>
        <div class="kv"><b>昵称</b><span>${esc(u.nickname || '—')}</span></div>
        <div class="kv"><b>角色</b><span class="tag ${u.role==='admin'?'admin':''}">${u.role==='admin'?'管理员':'用户'}</span></div>
        <div class="kv"><b>数据位置</b><span>服务器端</span></div>
      </div>
      <div class="card">
        <h3>微信通道（独立 · 服务器端）</h3>
        <div class="kv"><b>绑定状态</b><span id="wxState">检测中…</span></div>
        <div class="kv"><b>监听状态</b><span id="wxRun">—</span></div>
        <div id="wxQr" style="text-align:center;margin:8px 0"></div>
        <div class="rowbtns">
          <button class="btn btn-ghost" onclick="wxStart()">绑定微信</button>
          <button class="btn btn-ghost" onclick="wxUnbind()">解绑</button>
        </div>
        <div style="font-size:11.5px;color:var(--text-3);margin-top:8px">绑定后无需保持网页打开：服务器端持续独立监听，微信消息直接回复；微信与网页共用同一份历史。</div>
      </div>
      <div class="card">
        <h3>对话体验</h3>
        <div class="field" style="margin-bottom:8px">
          <label>思考强度</label>
          <select id="setThinking" style="width:100%;padding:7px 8px;margin-top:4px">
            <option value="off">关闭（off）</option>
            <option value="low">低（low）</option>
            <option value="mid">中（mid）</option>
            <option value="high">高（high）</option>
            <option value="ultra">极高（ultra）</option>
          </select>
        </div>
        <div class="field" style="margin-bottom:8px">
          <label>回复温度：<span id="setTempVal" style="color:var(--text)">0.8</span></label>
          <input id="setTemp" type="range" min="0" max="1.5" step="0.1" value="0.8" style="width:100%;margin-top:6px">
        </div>
        <div class="field" style="margin-bottom:10px">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input id="setShowThink" type="checkbox" style="width:auto"> 显示思考过程
          </label>
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="saveSettings()">保存体验设置</button>
      </div>
      <div class="card">
        <h3>会话</h3>
        <div class="rowbtns" style="margin-bottom:10px">
          <button class="btn btn-ghost" onclick="clearHistory()">清空当前聊天记录</button>
        </div>
        <div class="rowbtns">
          <button class="btn btn-ghost" onclick="location.href='/desktop'">桌面管理台</button>
          <button class="btn btn-ghost" onclick="logout()">退出登录</button>
        </div>
      </div>
      ${ (u.role==='admin') ? '<button class="btn btn-primary" onclick="openPanel(\'admin\')">用户池管理（管理员）</button>' : '' }`;
      bindTempSlider(); loadSettings(); wxRefresh();
  }
  else if (panelMode === 'admin') { renderAdmin(); }
}
async function renderAdmin() {
  const body = $('panelBody');
  body.innerHTML = '<div class="card">加载中…</div>';
  let users = [], pool = {};
  try {
    const r = await api('/v1/pool/users');
    users = r.users || []; pool = r.pool || {};
  } catch(e) { body.innerHTML = `<div class="card">加载失败：${esc(e.message)}</div>`; return; }
  body.innerHTML = `
    <div class="card">
      <h3>用户池概况</h3>
      <div class="kv"><b>总账号</b><span>${pool.total_users ?? '—'}</span></div>
      <div class="kv"><b>启用中</b><span>${pool.active_users ?? '—'}</span></div>
      <div class="kv"><b>在线会话</b><span>${pool.online_sessions ?? '—'}</span></div>
    </div>
    <div class="card">
      <h3>快速开户</h3>
      <div class="field" style="margin-bottom:8px"><input id="nuName" placeholder="用户名"></div>
      <div class="field" style="margin-bottom:8px"><input id="nuPass" placeholder="初始密码（至少 4 位）"></div>
      <div class="field" style="margin-bottom:10px"><input id="nuNick" placeholder="昵称（可选）"></div>
      <button class="btn btn-primary" style="width:100%" onclick="adminAddUser()">添加用户</button>
    </div>
    <div class="card">
      <h3>账号列表</h3>
      ${users.map(u => `
        <div class="user-item">
          <div class="uinfo">
            <div class="uname">${esc(u.username)} ${u.role==='admin'?'<span class="tag admin">管理员</span>':''} ${u.status!=='active'?'<span class="tag off">已停用</span>':''} ${u.wechat_running?'<span class="tag wx">微信在线</span>':(u.wechat_bound?'<span class="tag wx-off">微信已绑</span>':'')}</div>
            <div class="umeta">${esc(u.nickname||'—')} · 消息 ${u.message_count ?? 0} 条</div>
          </div>
          <button class="mini-btn" onclick="adminResetPass(${u.id})">改密</button>
          <button class="mini-btn" onclick="adminToggle(${u.id}, '${u.status==='active'?'disabled':'active'}')">${u.status==='active'?'停用':'启用'}</button>
        </div>`).join('')}
    </div>`;
}
async function adminAddUser() {
  const username = $('nuName').value.trim(), password = $('nuPass').value, nickname = $('nuNick').value.trim();
  if (!username || !password) { toast('请填写用户名和密码'); return; }
  try {
    await api('/v1/pool/users', { method:'POST', body:{ username, password, nickname } });
    toast('已添加'); renderAdmin();
  } catch(e) { toast(e.message || '添加失败'); }
}
async function adminToggle(id, status) {
  try { await api(`/v1/pool/users/${id}/status`, { method:'POST', body:{ status } }); renderAdmin(); }
  catch(e) { toast(e.message || '操作失败'); }
}
async function adminResetPass(id) {
  const password = prompt('新密码（至少 4 位）');
  if (!password) return;
  try { await api(`/v1/pool/users/${id}/password`, { method:'POST', body:{ password } }); toast('已重置'); }
  catch(e) { toast(e.message || '重置失败'); }
}
async function clearHistory() {
  try {
    await api(`/v1/chat/history/clear?user_id=${encodeURIComponent(S.user.user_key)}&char_id=${encodeURIComponent(S.charId)}`, { method:'POST' });
    toast('已清空'); closePanel(); await loadHistory();
  } catch(e) { toast(e.message || '清空失败'); }
}
async function logout(silent=false) {
  clearInterval(WX.timer); WX.polling = false;
  try { await api('/v1/pool/logout', { method:'POST' }); } catch(e) {}
  localStorage.removeItem('qiyu_token');
  S.token = ''; S.user = null;
  $('messages').innerHTML = '';
  showPage('auth');
  if (!silent) toast('已退出');
}

/* ===== 启动 ===== */
(async function boot() {
  // 无论本地是否存过 token，都先尝试 Cookie 会话（cookie 由服务端管理）
  showPage('chat');
  $('messages').innerHTML = '<div class="sys-note">正在恢复登录状态…</div>';
  try {
    const me = await api('/v1/pool/me');
    S.user = me.user;
    await enterChat();
  } catch(e) {
    // 会话无效/过期：清本地 token 回登录页（cookie 交给服务端处理）
    localStorage.removeItem('qiyu_token');
    S.token = ''; S.user = null;
    showPage('auth');
  }
})();
</script>
